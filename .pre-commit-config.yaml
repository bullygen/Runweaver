repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: mypy-core
        name: mypy core contracts
        entry: mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
