name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=runweaver --cov-report=term -q

  quality-docs-tutorials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,docs,optuna]'
      - run: ruff check .
      - run: mypy
      - run: mkdocs build --strict
      - name: Execute paired notebooks
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=180
          --output-dir=/tmp/runweaver-notebooks tutorials/*.ipynb

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python -m venv /tmp/runweaver-clean
      - run: /tmp/runweaver-clean/bin/pip install dist/*.whl
      - run: /tmp/runweaver-clean/bin/runweaver --help
